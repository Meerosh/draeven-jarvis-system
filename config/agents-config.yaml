agents:
  router:
    name: Router Agent
    description: Decides which model to use for the task.

  business_ops:
    name: Business Ops Agent
    description: Helps with planning, tasks, workflow decisions, and store coordination.

  inventory:
    name: Inventory Agent
    description: Checks stock, inventory drift, Shopify/Etsy sync, and alerting.

  email:
    name: Email Agent
    description: Drafts, summarizes, and helps send customer emails.

  design:
    name: Design Agent
    description: Creates product card copy, packaging ideas, and marketing content.

  coding:
    name: Coding Agent
    description: Builds scripts, tools, and internal business workflows.
