default_llm: ollama
allow_fallback: true

routes:
  - name: simple_questions
    condition: "task_type == 'general' and complexity <= 3"
    provider: ollama

  - name: long_context
    condition: "context_tokens > 40000"
    provider: claude

  - name: coding_tasks
    condition: "task_type == 'coding' or task_type == 'automation'"
    provider: openai

  - name: creative_tasks
    condition: "task_type == 'creative' or task_type == 'marketing'"
    provider: gemini

  - name: general_business
    condition: "task_type == 'business'"
    provider: ollama

  - name: default_fallback
    condition: "true"
    provider: ollama
