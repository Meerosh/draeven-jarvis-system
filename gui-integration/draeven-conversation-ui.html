<!-- Add this div to your index.html (after the command-form, before closing body) -->
<!-- This creates the conversation display area for backend responses -->

<div id="conversation-display" class="conversation-area" role="region" aria-label="Conversation with Draeven"></div>

<!-- 
Add this CSS to your styles.css 
-->

<style>
#conversation-display {
  margin-top: 2rem;
  padding: 1rem;
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 8px;
  background: rgba(0, 0, 0, 0.3);
  max-height: 500px;
  min-height: 200px;
  overflow-y: auto;
  font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
  font-size: 0.9rem;
  color: #e0e0e0;
  line-height: 1.5;
}

.conversation-entry {
  margin-bottom: 1.5rem;
  padding: 0.75rem 1rem;
  border-left: 4px solid rgba(255, 255, 255, 0.2);
  border-radius: 4px;
  animation: slideIn 0.3s ease-out;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.conversation-entry.role-user {
  background: rgba(100, 150, 255, 0.08);
  border-left-color: #6496ff;
  margin-left: 1rem;
}

.conversation-entry.role-assistant {
  background: rgba(100, 200, 150, 0.08);
  border-left-color: #64c896;
  margin-right: 1rem;
}

.message-label {
  font-weight: bold;
  color: #a0d8ff;
  margin-bottom: 0.5rem;
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.conversation-entry.role-assistant .message-label {
  color: #64c896;
}

.message-body {
  color: #e0e0e0;
  line-height: 1.5;
  word-wrap: break-word;
  white-space: pre-wrap;
  font-size: 0.95rem;
}

/* Scrollbar styling */
#conversation-display::-webkit-scrollbar {
  width: 8px;
}

#conversation-display::-webkit-scrollbar-track {
  background: rgba(255, 255, 255, 0.05);
}

#conversation-display::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.1);
  border-radius: 4px;
}

#conversation-display::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, 0.2);
}

/* Toast styling (for notifications) */
.toast {
  position: fixed;
  bottom: 2rem;
  right: 2rem;
  background: rgba(0, 0, 0, 0.9);
  color: #e0e0e0;
  padding: 1rem 1.5rem;
  border-radius: 4px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  font-size: 0.9rem;
  z-index: 9999;
  animation: toastSlideIn 0.3s ease-out;
}

@keyframes toastSlideIn {
  from {
    opacity: 0;
    transform: translateX(20px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}
</style>
