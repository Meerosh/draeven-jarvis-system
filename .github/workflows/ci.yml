name: Draeven verification

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - run: python tests/verify_repository.py
      - run: python -m unittest discover -s runtime/frontdoor -p "test_*.py"
      - run: python -m unittest discover -s runtime/control-plane -p "test_*.py"
      - run: python -m unittest discover -s hud -p "test_*.py"
      - run: node --check hud/js/main.js
      - run: node --check hud/js/voice.js
